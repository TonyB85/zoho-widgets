<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account Hierarchy Viewer</title>
  <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f6f8; color: #26284A; min-height: 100vh; padding: 20px 24px;
    }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .header-icon {
      width: 36px; height: 36px; background: #26284A;
      border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 600; color: #26284A; }
    .header-sub   { font-size: 11px; color: #8890a4; margin-top: 2px; }
    .state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 60px 20px; gap: 12px; text-align: center;
    }
    .state-label { font-size: 13px; color: #8890a4; }
    .spinner {
      width: 32px; height: 32px; border: 3px solid #e4e6ed;
      border-top-color: #FC664A; border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box {
      background: #fff5f3; border: 1px solid #ffd0c8;
      border-radius: 8px; padding: 14px 16px; font-size: 12px; color: #c0392b;
    }
    .tree-scroll { overflow-x: auto; overflow-y: visible; padding-bottom: 8px; }
    .tree-row {
      display: flex; flex-direction: row; align-items: flex-start;
      padding: 8px 0; min-width: fit-content;
    }
    .tier-col { display: flex; flex-direction: column; align-items: flex-start; }
    .tier-header {
      font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: #b0b5c8; padding: 0 0 12px 4px; white-space: nowrap;
    }
    .tier-nodes { display: flex; flex-direction: column; gap: 10px; }
    .node-card {
      background: #fff; border: 1.5px solid #e4e6ed;
      border-radius: 12px; padding: 12px 18px; width: 210px;
      cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
      position: relative;
    }
    .node-card:hover {
      border-color: #FC664A; box-shadow: 0 4px 20px rgba(252,102,74,0.13); transform: translateY(-1px);
    }
    .node-card.active { border-color: #26284A; box-shadow: 0 4px 20px rgba(38,40,74,0.15); }
    .node-card.active::before {
      content: ''; position: absolute; left: -1.5px; top: -1.5px; bottom: -1.5px;
      width: 4px; background: #FC664A; border-radius: 12px 0 0 12px;
    }
    .node-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 3px 8px; border-radius: 20px; margin-bottom: 7px;
    }
    .badge-group  { background: #eef0f8; color: #26284A; }
    .badge-entity { background: #e8f0fb; color: #2E4E79; }
    .badge-brand  { background: #fff0ed; color: #FC664A; }
    .badge-unknown{ background: #f0f0f0; color: #888; }
    .node-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot-group  { background: #26284A; }
    .dot-entity { background: #2E4E79; }
    .dot-brand  { background: #FC664A; }
    .node-name { font-size: 13px; font-weight: 600; color: #26284A; line-height: 1.3; word-break: break-word; }
    .node-parent-hint { font-size: 10px; color: #8890a4; margin-top: 4px; }
    .legend {
      display: flex; gap: 18px; flex-wrap: wrap;
      margin-top: 24px; padding-top: 16px; border-top: 1px solid #e4e6ed; align-items: center;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8890a4; }
    .legend-dot  { width: 9px; height: 9px; border-radius: 50%; }
    .legend-swatch { width: 12px; height: 12px; border-radius: 3px; }
    .legend-hint { margin-left: auto; font-size: 10px; color: #c0c5d4; }
  </style>
</head>
<body>
<div class="header">
  <div class="header-icon">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <rect x="9" y="1" width="6" height="4" rx="1" fill="white"/>
      <rect x="1" y="10" width="6" height="4" rx="1" fill="white"/>
      <rect x="17" y="10" width="6" height="4" rx="1" fill="white"/>
      <rect x="9" y="19" width="6" height="4" rx="1" fill="white"/>
      <line x1="12" y1="5" x2="12" y2="10" stroke="white" stroke-width="1.5"/>
      <line x1="4" y1="10" x2="20" y2="10" stroke="white" stroke-width="1.5"/>
      <line x1="4" y1="14" x2="4" y2="19" stroke="white" stroke-width="1.5"/>
      <line x1="20" y1="14" x2="20" y2="19" stroke="white" stroke-width="1.5"/>
    </svg>
  </div>
  <div>
    <div class="header-title">Account Hierarchy</div>
    <div class="header-sub">Group · Legal Entity · Brand</div>
  </div>
</div>
<div id="root">
  <div class="state"><div class="spinner"></div><div class="state-label">Initialising…</div></div>
</div>
<script>
const ACCOUNT_LEVEL_FIELD  = 'Account_Level';
const PARENT_ACCOUNT_FIELD = 'Parent_Account';
const ACCOUNT_NAME_FIELD   = 'Account_Name';
const CONN_W   = 52;
const NODE_H   = 76;  // card height
const NODE_GAP = 10;  // gap between cards
const GROUP_GAP = 33; // extra gap between brand groups (padding-top 16 + border ~1 + margin-top 16)
const ENTITY_COLORS = ['#2E4E79','#00A9A5','#F7D08A','#FC664A','#8B5CF6'];

function setHTML(html) { document.getElementById('root').innerHTML = html; }
function showError(msg) { setHTML(`<div class="error-box">⚠ ${msg}</div>`); }

function getLevel(val) {
  const v = ((val && (val.name || val)) || '').toString().toLowerCase().trim();
  if (v === 'group')  return 'group';
  if (v === 'entity') return 'entity';
  if (v === 'brand')  return 'brand';
  return 'unknown';
}
function badgeClass(l) { return ({group:'badge-group',entity:'badge-entity',brand:'badge-brand'})[l]||'badge-unknown'; }
function dotClass(l)   { return ({group:'dot-group',entity:'dot-entity',brand:'dot-brand'})[l]||''; }
function levelLabel(l) { return ({group:'Group',entity:'Legal Entity',brand:'Brand',unknown:'Unknown'})[l]||l; }

function nodeCard(acct, currentId, entityIdx, parentName) {
  const level    = getLevel(acct[ACCOUNT_LEVEL_FIELD]);
  const name     = acct[ACCOUNT_NAME_FIELD] || acct.name || 'Unnamed';
  const isActive = acct.id === currentId;
  const color    = (entityIdx !== undefined && level === 'brand') ? ENTITY_COLORS[entityIdx % 5] : null;
  const borderStyle = color ? `style="border-left: 4px solid ${color};"` : '';
  const hint = parentName ? `<div class="node-parent-hint">↳ ${parentName}</div>` : '';
  return `<div class="node-card ${isActive ? 'active' : ''}" ${borderStyle}
       onclick="openRecord('${acct.id}')" title="Open ${name}">
    <div class="node-badge ${badgeClass(level)}">
      <span class="node-dot ${dotClass(level)}"></span>${levelLabel(level)}
    </div>
    <div class="node-name">${name}</div>${hint}
  </div>`;
}

function openRecord(id) { ZOHO.CRM.UI.Record.open({ Entity: 'Accounts', RecordID: id }); }

async function getRecord(id) {
  const resp = await ZOHO.CRM.API.getRecord({ Entity: 'Accounts', RecordID: id });
  if (!resp || !resp.data || !resp.data[0]) throw new Error('Record not found: ' + id);
  return resp.data[0];
}
async function getChildAccounts(parentId) {
  const resp = await ZOHO.CRM.API.coql({
    select_query: `SELECT id, ${ACCOUNT_NAME_FIELD}, ${ACCOUNT_LEVEL_FIELD}, ${PARENT_ACCOUNT_FIELD} FROM Accounts WHERE ${PARENT_ACCOUNT_FIELD} = '${parentId}' LIMIT 20`
  });
  return (resp && resp.data) ? resp.data : [];
}
async function buildHierarchy(currentId) {
  let record = await getRecord(currentId);
  const seen = new Set([currentId]);
  while (record[PARENT_ACCOUNT_FIELD]) {
    const parentId = record[PARENT_ACCOUNT_FIELD].id || record[PARENT_ACCOUNT_FIELD];
    if (seen.has(parentId)) break;
    seen.add(parentId);
    record = await getRecord(parentId);
  }
  const root  = record;
  const tier2 = await getChildAccounts(root.id);
  const tier3 = {};
  for (const t2 of tier2) tier3[t2.id] = await getChildAccounts(t2.id);
  return { root, tier2, tier3 };
}

// Calculate exact Y midpoint for each brand card, accounting for group gaps
function calcBrandYPositions(tier2, tier3) {
  const positions = []; // { y, entityIdx }
  let y = 0;
  let firstGroup = true;
  for (let ei = 0; ei < tier2.length; ei++) {
    const brands = tier3[tier2[ei].id] || [];
    if (brands.length === 0) continue;
    // Add group gap before every group after the first
    if (!firstGroup) y += GROUP_GAP;
    firstGroup = false;
    for (let bi = 0; bi < brands.length; bi++) {
      positions.push({ y: y + NODE_H / 2, entityIdx: ei });
      y += NODE_H;
      if (bi < brands.length - 1) y += NODE_GAP;
    }
  }
  return positions;
}

function buildConnectorSVG(tier2, tier3) {
  const brandPos = calcBrandYPositions(tier2, tier3);
  if (brandPos.length === 0) return { svg: '', svgH: 0 };

  // Entity Y positions (simple, no group gaps)
  const entityYs = tier2.map((_, i) => i * (NODE_H + NODE_GAP) + NODE_H / 2);

  const svgH = brandPos[brandPos.length - 1].y + NODE_H / 2;
  let lines = '';

  for (let ei = 0; ei < tier2.length; ei++) {
    const myBrands = brandPos.filter(b => b.entityIdx === ei);
    if (myBrands.length === 0) continue;
    const color = ENTITY_COLORS[ei % 5];
    const ey = entityYs[ei];

    // Horizontal from entity right edge to spine
    lines += `<line x1="0" y1="${ey}" x2="${CONN_W/2}" y2="${ey}" stroke="${color}" stroke-width="2"/>`;

    const firstBY = myBrands[0].y;
    const lastBY  = myBrands[myBrands.length - 1].y;
    const spineTop    = Math.min(ey, firstBY);
    const spineBottom = Math.max(ey, lastBY);

    // Vertical spine
    lines += `<line x1="${CONN_W/2}" y1="${spineTop}" x2="${CONN_W/2}" y2="${spineBottom}" stroke="${color}" stroke-width="2"/>`;

    // Horizontal to each brand
    for (const b of myBrands) {
      lines += `<line x1="${CONN_W/2}" y1="${b.y}" x2="${CONN_W}" y2="${b.y}" stroke="${color}" stroke-width="2"/>`;
    }
  }

  return { svg: `<svg width="${CONN_W}" height="${svgH}" style="overflow:visible;">${lines}</svg>`, svgH };
}

function renderTree({ root, tier2, tier3 }, currentId) {
  let html = '<div class="tree-scroll"><div class="tree-row">';

  // Group column
  html += `<div class="tier-col">
    <div class="tier-header">Group</div>
    <div class="tier-nodes">${nodeCard(root, currentId)}</div>
  </div>`;

  if (tier2.length > 0) {
    // Connector: Group → Entities
    const totalEntityH = tier2.length * NODE_H + (tier2.length - 1) * NODE_GAP;
    const gMid = NODE_H / 2;
    let c1 = `<line x1="0" y1="${gMid}" x2="${CONN_W/2}" y2="${gMid}" stroke="#26284A" stroke-width="2"/>`;
    if (tier2.length > 1) {
      const lastEY = (NODE_H + NODE_GAP) * (tier2.length - 1) + NODE_H / 2;
      c1 += `<line x1="${CONN_W/2}" y1="${gMid}" x2="${CONN_W/2}" y2="${lastEY}" stroke="#26284A" stroke-width="2"/>`;
    }
    for (let i = 0; i < tier2.length; i++) {
      const ey = (NODE_H + NODE_GAP) * i + NODE_H / 2;
      c1 += `<line x1="${CONN_W/2}" y1="${ey}" x2="${CONN_W}" y2="${ey}" stroke="#26284A" stroke-width="2"/>`;
    }
    html += `<div style="width:${CONN_W}px;padding-top:30px;flex-shrink:0;">
      <svg width="${CONN_W}" height="${totalEntityH}" style="overflow:visible;">${c1}</svg>
    </div>`;

    // Entity column
    html += `<div class="tier-col">
      <div class="tier-header">Legal Entities</div>
      <div class="tier-nodes">`;
    for (let ei = 0; ei < tier2.length; ei++) html += nodeCard(tier2[ei], currentId);
    html += `</div></div>`;

    // Connector: Entities → Brands
    const allBrands = tier2.flatMap(e => tier3[e.id] || []);
    if (allBrands.length > 0) {
      const { svg } = buildConnectorSVG(tier2, tier3);
      html += `<div style="width:${CONN_W}px;padding-top:30px;flex-shrink:0;">${svg}</div>`;

      // Brand column — grouped with dividers
      html += `<div class="tier-col">
        <div class="tier-header">Brands</div>
        <div class="tier-nodes">`;
      let firstGroup = true;
      for (let ei = 0; ei < tier2.length; ei++) {
        const brands = tier3[tier2[ei].id] || [];
        if (brands.length === 0) continue;
        const entityName = tier2[ei][ACCOUNT_NAME_FIELD] || 'Entity';
        const divider = !firstGroup ? `style="margin-top:16px;padding-top:16px;border-top:1px dashed #e4e6ed;"` : '';
        html += `<div ${divider}>`;
        for (const brand of brands) html += nodeCard(brand, currentId, ei, entityName);
        html += `</div>`;
        firstGroup = false;
      }
      html += `</div></div>`;
    }
  }

  html += `</div></div>`;

  // Legend
  html += `<div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#26284A"></div>Group</div>
    <div class="legend-item"><div class="legend-dot" style="background:#2E4E79"></div>Legal Entity</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FC664A"></div>Brand</div>
    <div style="width:1px;height:14px;background:#e4e6ed;margin:0 4px;"></div>`;
  for (let i = 0; i < Math.min(tier2.length, 5); i++) {
    const name = tier2[i][ACCOUNT_NAME_FIELD] || 'Entity';
    html += `<div class="legend-item"><div class="legend-swatch" style="background:${ENTITY_COLORS[i%5]};opacity:0.85;"></div>${name}</div>`;
  }
  html += `<div class="legend-hint">Click any node to open record</div></div>`;

  setHTML(html);
}

ZOHO.embeddedApp.on('PageLoad', async function(data) {
  try {
    const currentId = data && (data.EntityId || data.recordId || data.id);
    if (!currentId) { showError('No record ID received from CRM.'); return; }
    const hierarchy = await buildHierarchy(currentId);
    renderTree(hierarchy, currentId);
  } catch(e) {
    showError('Could not load hierarchy: ' + (e.message || String(e)));
  }
});
ZOHO.embeddedApp.init();
</script>
</body>
</html>
